name: Bug Report
description: Create a report to help us improve bzip2.zig
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - muhammad-fiaz
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out a bug report for **bzip2.zig**!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: I am experiencing an issue where...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Add the bzip2.zig dependency to build.zig
        2. Call `bzip2.compress(...)` or `bzip2.decompress(...)`
        3. See unexpected behavior or error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bzip2.zig Version
      description: What version of bzip2.zig are you using?
      placeholder: 0.0.2
    validations:
      required: true
  - type: input
    id: zig_version
    attributes:
      label: Zig Version
      description: What version of Zig are you using?
      placeholder: 0.17.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which Part of the Library
      description: Where does the problem show up?
      options:
        - One-Shot (compress / decompress)
        - Streaming Encoder (Compressor / compressStream)
        - Streaming Decoder (Decoder / Decompressor / decompressStream)
        - Whole-File Helpers (compressFile / decompressFile)
        - Header Introspection (blockSizeOfStream / maxCompressedSize)
        - Allocator or Memory Behaviour
        - Other
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - FreeBSD
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output / Stack Trace
      description: Please copy and paste any relevant terminal or error output.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct & Contribution Guidelines
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/muhammad-fiaz/bzip2.zig/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
        - label: I have searched existing issues and verified this is not a duplicate report
          required: true
